name: Build and Release

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/stg/latest.zip" -OutFile dalamud.zip
          $dest = "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive dalamud.zip -DestinationPath $dest -Force
        shell: pwsh

      - name: Get version
        id: version
        run: |
          $version = (Select-Xml -Path "src/PanacheUI.csproj" -XPath "//Version").Node.InnerText
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build
        run: dotnet build src/PanacheUI.csproj --configuration Release --no-incremental
        shell: pwsh

      - name: Package
        run: |
          $ErrorActionPreference = "Stop"

          # src/PanacheUI.csproj sets <OutDir>../</OutDir> so a local build drops straight
          # into the repo root, which IS the folder Dalamud loads the dev plugin from. CI
          # gets the same layout, so the build output is the repo root — NOT src/bin/x64/
          # Release. That desync silently red-lined every release from 08a9a92 onward;
          # read the "$bin path desynced from csproj OutDir" entry in devPlugins/BROKEN.md
          # before changing either side.
          $bin  = "."
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # Fail loudly and specifically if OutDir ever moves again, instead of leaving a
          # bare "cannot find path" for the next person to reverse-engineer.
          if (-not (Test-Path "$bin/PanacheUI.dll")) {
            Write-Error "PanacheUI.dll not found in '$bin'. <OutDir> in src/PanacheUI.csproj and `$bin here must agree."
          }

          Copy-Item "$bin/PanacheUI.dll" $dist
          Copy-Item "$bin/SkiaSharp.dll" $dist -ErrorAction SilentlyContinue

          # Bundle the manifest with the version injected rather than copied verbatim.
          # A hand-maintained AssemblyVersion in the source manifest drifts from <Version>
          # in the csproj the first time someone bumps one and not the other, and Dalamud
          # API 15 hard-rejects the install when the zip's manifest version is wrong.
          # See devPlugins/BROKEN.md, "Bundled <InternalName>.json missing AssemblyVersion".
          $version  = "${{ steps.version.outputs.VERSION }}"
          $manifest = Get-Content "PanacheUI.json" -Raw | ConvertFrom-Json
          $manifest.AssemblyVersion = $version
          $manifest | ConvertTo-Json -Depth 10 | Set-Content "$dist/PanacheUI.json" -Encoding utf8
          Write-Host "Bundled manifest AssemblyVersion=$version"

          # Bundle the icon set. Without this the zip carries no Icons folder, so on a real
          # user's machine PanacheIcons.ResolveIconsFolder misses every strategy and all 167
          # icons degrade to placeholder swatches (the failure PanacheIcons' own docs describe
          # for 0.81.28.0). Every release through v0.1.3 shipped exactly that way.
          Copy-Item "$bin/Icons" $dist -Recurse
          $iconCount = (Get-ChildItem "$dist/Icons" -Filter *.png).Count
          if ($iconCount -lt 1) { Write-Error "No icons packaged; the zip would ship placeholder swatches." }
          Write-Host "Packaged $iconCount icons"

          # Same story as Icons: ThemeLoader.ResolveThemesFolder looks for a Themes folder
          # beside the assembly, and Reload() registers zero external themes and returns
          # silently when it isn't there. Every release through v0.1.4 shipped without it,
          # so installed users saw only the code-level built-ins and none of the bundled
          # themes. preview.png / rules_report.txt are ignored by the loader but ship
          # anyway — the README the plugin writes tells users they're there for reference,
          # and filtering the copy is one more chance to drop a file the loader wanted.
          Copy-Item "$bin/Themes" $dist -Recurse
          $themeCount = (Get-ChildItem "$dist/Themes" -Recurse -Filter theme.json).Count
          if ($themeCount -lt 1) { Write-Error "No themes packaged; installed users would get built-ins only." }
          Write-Host "Packaged $themeCount themes"

          # Bundle libSkiaSharp in the runtimes subfolder so .NET finds it
          $native = "$dist/runtimes/win-x64/native"
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          Copy-Item "$bin/runtimes/win-x64/native/libSkiaSharp.dll" $native

          Compress-Archive -Path "$dist/*" -DestinationPath PanacheUI.zip -Force
        shell: pwsh

      # Assert against the ACTUAL zip, not the dist folder that produced it. A green build
      # has never been evidence that the artifact is installable — that is the standing
      # lesson at the bottom of devPlugins/BROKEN.md.
      - name: Verify artifact
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "PanacheUI.zip"))
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }

            foreach ($required in @("PanacheUI.dll", "PanacheUI.json", "runtimes/win-x64/native/libSkiaSharp.dll")) {
              if ($names -notcontains $required) { Write-Error "Zip is missing $required" }
            }

            $icons = @($names | Where-Object { $_ -like "Icons/*.png" })
            if ($icons.Count -lt 1) { Write-Error "Zip contains no Icons/*.png - icons would render as placeholder swatches." }

            $themes = @($names | Where-Object { $_ -like "Themes/*/theme.json" })
            if ($themes.Count -lt 1) { Write-Error "Zip contains no Themes/*/theme.json - installed users would get built-ins only." }

            $entry  = $zip.Entries | Where-Object { $_.FullName -eq "PanacheUI.json" }
            $reader = New-Object System.IO.StreamReader($entry.Open())
            $bundled = $reader.ReadToEnd() | ConvertFrom-Json
            $reader.Close()
            if ($bundled.AssemblyVersion -ne "${{ steps.version.outputs.VERSION }}") {
              Write-Error "Zip manifest AssemblyVersion is '$($bundled.AssemblyVersion)', expected '${{ steps.version.outputs.VERSION }}'"
            }

            Write-Host "Artifact OK - $($icons.Count) icons, $($themes.Count) themes, manifest AssemblyVersion=$($bundled.AssemblyVersion)"
          } finally {
            $zip.Dispose()
          }
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanacheUI
          path: dist/

      - name: Update pluginmaster.json version
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $json = @(Get-Content pluginmaster.json | ConvertFrom-Json)
          $json[0].AssemblyVersion        = $version
          $json[0].TestingAssemblyVersion = $version
          $json | ConvertTo-Json -Depth 10 -AsArray | Set-Content pluginmaster.json
        shell: pwsh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          files: PanacheUI.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated pluginmaster.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git diff --staged --quiet || git commit -m "ci: update pluginmaster.json to v${{ steps.version.outputs.VERSION }}"
          git push
        shell: pwsh
